id = "W10"
title = "WSL: the horizontal wheel reports right as button 67 and left as button 66"
requires = ["wsl:Ubuntu-24.04"]
config = """
command = wsl.exe -d Ubuntu-24.04 -e bash --noprofile --norc
language = en
"""
expect = [
  "hwheel: cat -v shows one ^[[<67;…M for the right tilt, then one ^[[<66;…M for the left tilt",
]

[[step]]
action = "sleep"
seconds = 3.0

[[step]]
action = "type"
text = "printf '\\e[?1000h\\e[?1006h'; cat -v\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "wheel"
in = "terminal:0"
x = "50%"
y = "60%"
delta = 120
horizontal = true

[[step]]
action = "sleep"
seconds = 0.4

[[step]]
action = "wheel"
in = "terminal:0"
x = "50%"
y = "60%"
delta = -120
horizontal = true

[[step]]
action = "sleep"
seconds = 0.6

[[step]]
action = "capture"
name = "hwheel"
