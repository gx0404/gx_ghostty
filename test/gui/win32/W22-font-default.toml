id = "W22"
title = "R2-Font: default faces, Unicode fallback and missing characters"
# Imported in phase 6 from the external R2-Font fixture W20-R2-Font-default.toml.
# The prompt is PowerShell 7 (pwsh.exe); without it the scenario is SKIPPED.
requires = ['file:%ProgramFiles%\PowerShell\7\pwsh.exe']
# GHOSTTY_GX_PERF logs font.first_fallback once (R2-Font.01/.04 log evidence, no timing gate).
env = { GHOSTTY_GX_PERF = "1" }
config = """
command = pwsh.exe -NoLogo -NoProfile
language = en
window-width = 100
window-height = 24
"""
expect = [
  "default-150: regular, bold, italic and bold italic are distinct; CJK, Greek, emoji and Nerd Font private-use glyphs render; U+0378 and U+FFFE are explicitly labeled expected missing glyphs",
  "default-100: the same content remains legible after isolated simulated 96 DPI, with no clipping or corrupted rows",
  "default-200: the same content at a simulated 192 DPI (PrintWindow): every row legible and scaled, no clipped glyphs",
]

[[step]]
action = "sleep"
seconds = 1.0

# The text goes in with type: KEYEVENTF_UNICODE (VK_PACKET) characters, which no input method
# composes, and Enter; the scenario needs no keyboard layout switch.
[[step]]
action = "type"
text = '''[Console]::OutputEncoding=[Text.UTF8Encoding]::new($false); Clear-Host; $e=[char]27; [Console]::Write("${e}[0mRegular:     ABCD 0123456789 -> ffi`r`n${e}[1mBold:        ABCD 0123456789 -> ffi`r`n${e}[0;3mItalic:      ABCD 0123456789 -> ffi`r`n${e}[1;3mBold italic: ABCD 0123456789 -> ffi`r`n${e}[0mCJK / Greek: 中文 日本語 한국어 Ω`r`nEmoji / PUA: $([char]::ConvertFromUtf32(0x1F600)) $([char]0xE0B0) $([char]0xF120)`r`nMissing (expected boxes): U+0378=$([char]0x378) U+FFFE=$([char]0xFFFE)`r`n"); $Host.UI.RawUI.WindowTitle='R2-Font ready'
'''

[[step]]
action = "wait_title"
pattern = "R2-Font ready"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "assert_responsive"

[[step]]
action = "capture"
name = "default-150"

[[step]]
action = "dpi"
value = 96

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "default-100"

[[step]]
action = "dpi"
value = 192

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "default-200"
method = "print"

[[step]]
action = "assert_responsive"

# R2-Font.01: the first fallback (CJK, Greek, emoji) was resolved and logged once.
[[step]]
action = "assert_log"
pattern = 'gx_perf\): font\.first_fallback \d+us'
