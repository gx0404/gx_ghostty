id = "W13"
title = "The quick terminal has the keyboard focus as soon as it starts sliding in"
# R0: quick and main-unchanged. Phase 6 (r6) extends the case for R2-Surface.09 and
# R2-Quick.01-08: the GHOSTTY_QUICK_TERMINAL environment marker, a new tab refused in the
# quick terminal, its own find bar not hiding it (autohide on), the find bar hiding with it and
# the keyboard going back to the main window, a slide turned around midway keeping the toggle
# intent, autohide when the main window is activated, and the last tab sliding out so that
# the next toggle makes a new quick terminal, and a configuration reload that changes
# quick-terminal-size moves the shown window to its new size without a size overlay. Work area,
# taskbar, display changes and DPI placement are not covered (one monitor, no system changes).
# Microsoft Pinyin takes Ctrl+Shift+F as its simplified/traditional switch, so this scenario opens
# the quick terminal's search bar with F9 (start_search, bound below), a key no input method takes:
# it needs no keyboard layout switch and runs the same with any input method. The configuration
# that the reload step writes keeps this binding too.
config = """
command = cmd.exe /d /k prompt $G$S
language = en
keybind = global:ctrl+grave_accent=toggle_quick_terminal
quick-terminal-animation-duration = 0.5
quick-terminal-autohide = true
keybind = ctrl+shift+r=reload_config
keybind = f9=start_search
"""
expect = [
  "quick: the quick terminal shows `echo typed-into-quick` and its output, typed right after the hotkey",
  "main-unchanged: the main window's prompt line is still empty",
  "quick-env: in the quick terminal `echo QT=%GHOSTTY_QUICK_TERMINAL%` printed QT=1",
  "new-tab-rejected: Ctrl+Shift+T in the quick terminal made no tab: still one terminal, no tab row",
  "quick-own-popup and quick-own-popup-bar: the quick terminal's own find bar took the focus without autohiding the quick terminal",
  "focus-returned: after the hotkey hid the quick terminal (and its find bar), `echo back-in-main` ran in the main window",
  "after-reversal: a slide turned around midway, then the next toggle showed the quick terminal fully in place with its content (QT=1 still on screen)",
  "reshown-after-autohide: activating the main window autohid the quick terminal, so the next hotkey showed it again",
  "recreated: after `exit` closed its last tab, the next hotkey made a new quick terminal with a fresh prompt (no earlier output)",
  "relayout-quick: after quick-terminal-size = 50% and a reload, the shown quick terminal is about half the work area high (was 400 DIP, 600 px)",
  "relayout-popups: no columns × rows size overlay is among the popups after that program-driven resize (a reload toast may show)",
]

[[step]]
action = "wait_log"
pattern = "registered global hotkey"

# Type immediately after the hotkey, while the quick terminal is still sliding in.
[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "type"
text = "echo typed-into-quick\n"

[[step]]
action = "wait_window"
window = "quick"
timeout = 5

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "quick"
what = "quick"

[[step]]
action = "capture"
name = "main-unchanged"
method = "print"

# --- r6 extension (R2-Surface.09, R2-Quick.01-08) -------------------------------------------
[[step]]
action = "type"
text = "echo QT=%GHOSTTY_QUICK_TERMINAL%\n"

[[step]]
action = "sleep"
seconds = 0.6

[[step]]
action = "capture"
name = "quick-env"
what = "quick"

[[step]]
action = "key"
keys = "ctrl+shift+t"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "wait_terminals"
window = "quick"
count = 1

[[step]]
action = "capture"
name = "new-tab-rejected"
what = "quick"

[[step]]
action = "key"
keys = "f9"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "wait_window"
window = "quick"
timeout = 1

[[step]]
action = "capture"
name = "quick-own-popup"
what = "quick"

[[step]]
action = "capture"
name = "quick-own-popup-bar"
what = "popups"

# The hotkey hides the quick terminal with its find bar and gives the keyboard back.
[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 3

[[step]]
action = "type"
text = "echo back-in-main\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "focus-returned"

# Turn a slide around midway, then show it again.
[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "sleep"
seconds = 0.15

[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "sleep"
seconds = 1.2

[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "wait_window"
window = "quick"
timeout = 5

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "after-reversal"
what = "quick"

# Autohide: activating the main window hides the quick terminal, so the hotkey shows it again.
[[step]]
action = "activate"

[[step]]
action = "sleep"
seconds = 1.2

[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "wait_window"
window = "quick"
timeout = 5

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "reshown-after-autohide"
what = "quick"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "type"
text = "exit\n"

[[step]]
action = "sleep"
seconds = 2.0

[[step]]
action = "assert_responsive"

[[step]]
action = "activate"

[[step]]
action = "key"
keys = "ctrl+grave"

[[step]]
action = "wait_window"
window = "quick"
timeout = 5

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "recreated"
what = "quick"

# A reload that changes the size moves the shown quick terminal (relayout) without a size overlay.
[[step]]
action = "file"
path = "ghostty/config.ghostty"
text = "command = cmd.exe /d /k prompt $G$S\nlanguage = en\nkeybind = global:ctrl+grave_accent=toggle_quick_terminal\nquick-terminal-animation-duration = 0.5\nquick-terminal-autohide = true\nkeybind = ctrl+shift+r=reload_config\nkeybind = f9=start_search\nquick-terminal-size = 50%\nconfirm-close-surface = false\n"

[[step]]
action = "key"
keys = "ctrl+shift+r"

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "relayout-quick"
what = "quick"

[[step]]
action = "capture"
name = "relayout-popups"
what = "all"
