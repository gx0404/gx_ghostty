id = "W02"
title = "Editing chords in the search bar stay in the search box and never reach the shell"
# R0: the first two screenshots. Phase 6 (r6) extends the case for the R2-Find leaves: the
# counter, Enter/F3/Shift+F3 from the bar and the terminal, a button tooltip, focus without a
# caret, No results, the 240 DIP clamp in a narrow pane, the hovered-URL preview and the resize
# overlay.
config = """
command = cmd.exe /d /k prompt $G$S
language = en
"""
expect = [
  "search-box: the typed text and the editing chords stayed in the search box (word-wise editing removes the words abc and x; until the text editor gets word boundaries Ctrl+Backspace and Ctrl+Delete remove one character, leaving `needle ab`)",
  "shell-clean: after Esc the prompt line `> ` is empty: no needle, abc, ^Q or stray characters",
  "counter: the reopened bar reads needle and its counter shows {current}/6 (three matches on the command line, three in the output); the bar is 380 DIPs wide (570 px at 144 DPI) at the top-right of the terminal",
  "enter-next: Enter in the bar moved the current match; the total stayed 6",
  "tooltip: resting on the next button shows the tooltip Next Match (Enter) below the bar",
  "terminal-focus: after a click in the terminal the bar is still shown, without a caret in its field",
  "f3: F3 pressed while the terminal has the focus moved the current match forward; shift-f3: Shift+F3 moved it back",
  "no-results: the field reads zzqx with the caution border, the counter says No results in the caution color",
  "narrow-clamp: in the narrow right pane of the 1,400 px window the bar keeps its 240 DIP minimum (360 px at 144 DPI, wider than the pane) and still shows the counter; the whole bar and close button stay inside the window",
  "narrow-closed: clicking the close button inside the window ended the search (old geometry leaves the bar open)",
  "link-left: with Ctrl held on a row of the long URL output, the preview bubble at the bottom-left of the terminal keeps https://example.com/ and the end of the URL with an ellipsis in the middle, at most 60% of the terminal wide",
  "link-right: with the pointer on the URL prompt in the last row, under the bubble's place, the bubble for https://example.com/gx-r6-right/prompt shows at the bottom-right corner",
  "resize-overlay: right after the window was resized, the columns × rows overlay is shown in semibold",
]

# The pointer may rest on the chrome where a previous program left it (a tab bar button shows its
# tooltip, another popup); park it in the terminal first.
[[step]]
action = "move"
in = "terminal:0"
x = "50%"
y = "50%"

# Microsoft Pinyin takes Ctrl+Shift+F as its simplified/traditional switch.
[[step]]
action = "ime_off"

[[step]]
action = "key"
keys = "ctrl+shift+f"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "type"
text = "needle abc"

# Ctrl+Backspace deletes the word abc in the box; Ctrl+Q is unbound and must be swallowed.
[[step]]
action = "key"
keys = "ctrl+backspace"

[[step]]
action = "key"
keys = "ctrl+q"

[[step]]
action = "type"
text = "x"

[[step]]
action = "key"
keys = "ctrl+left"

[[step]]
action = "key"
keys = "ctrl+delete"

[[step]]
action = "sleep"
seconds = 0.3

[[step]]
action = "capture"
name = "search-box"
what = "all"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false

[[step]]
action = "sleep"
seconds = 0.3

[[step]]
action = "capture"
name = "shell-clean"

# --- r6 extension (R2-Find.01-05) -----------------------------------------------------------
# Six matches: three on the command line, three in its output.
[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "echo needle one& echo needle two& echo needle three\n"

[[step]]
action = "sleep"
seconds = 0.5

# Reopening keeps the previous text selected; Ctrl+A and typing replace it.
[[step]]
action = "key"
keys = "ctrl+shift+f"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "key"
keys = "ctrl+a"

[[step]]
action = "type"
text = "needle"

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "counter"
what = "all"

[[step]]
action = "key"
keys = "enter"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "enter-next"
what = "all"

# The next button sits 60 DIPs left of the terminal's right edge and 30 DIPs down: the bar has
# an 8 DIP margin and is 44 high; its buttons are 28 wide, 8 from its end, 2 apart.
[[step]]
action = "move"
in = "terminal:0"
x = -60
y = 30

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "tooltip"
what = "all"

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = "75%"

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "terminal-focus"
what = "all"

[[step]]
action = "key"
keys = "f3"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "f3"
what = "all"

[[step]]
action = "key"
keys = "shift+f3"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "shift-f3"
what = "all"

# Back into the bar: nothing matches.
[[step]]
action = "key"
keys = "ctrl+shift+f"

[[step]]
action = "sleep"
seconds = 0.4

[[step]]
action = "key"
keys = "ctrl+a"

[[step]]
action = "type"
text = "zzqx"

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "no-results"
what = "all"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false

# A narrow right-edge pane: drag the nested divider so the bar cannot fit,
# regardless of the desktop DPI. The bar must move left inside the window.
[[step]]
action = "resize"
width = 1400
height = 1000

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "key"
keys = "ctrl+shift+o"

[[step]]
action = "wait_terminals"
count = 2

[[step]]
action = "key"
keys = "ctrl+shift+o"

[[step]]
action = "wait_terminals"
count = 3

[[step]]
action = "drag_divider"
between = [1, 2]
fraction = 0.85

[[step]]
action = "click"
in = "terminal:2"
x = "50%"
y = "75%"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "key"
keys = "ctrl+shift+f"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "type"
text = "needle"

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "narrow-clamp"
what = "all"

[[step]]
# Click in window coordinates derived from the rightmost pane, not in the popup.
# Before D-14 the button is outside the window and this cannot close the bar.
action = "click"
in = "terminal:2"
x = -30
y = 30

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false

[[step]]
action = "capture"
name = "narrow-closed"
what = "all"

# Back to one pane: exit the two new panes.
[[step]]
action = "type"
text = "exit\n"

[[step]]
action = "wait_terminals"
count = 2

[[step]]
action = "click"
in = "terminal:1"
x = "50%"
y = "50%"

[[step]]
action = "type"
text = "exit\n"

[[step]]
action = "wait_terminals"
count = 1

[[step]]
action = "sleep"
seconds = 0.5

# The link preview. Output soft-wraps, so every row of a long URL printed by a program is part of
# the link; a command line echoed by ConPTY does not (its rows are separate lines), so the URLs come
# from output and from the prompt text. Blank lines push the prompt to the bottom first.
[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "type"
text = "for /L %i in (1,1,60) do @echo.\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "type"
text = "<nul set /p =https://example.com/gx-r6-preview/012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789/tail-end\n"

[[step]]
action = "sleep"
seconds = 1.0

# The core reports a hovered link only while Ctrl is down. Held presses keep the bubble up, and
# it stays 250 ms after the last release (the leave delay): long enough for the capture. 50 DIPs
# above the terminal's bottom is a row of the URL output (the prompt is the last row), above the
# bubble's place (the bottom 34 DIPs).
[[step]]
action = "move"
in = "terminal:0"
x = 60
y = -50

[[step]]
action = "key"
keys = "ctrl"
repeat = 10
delay = 0.1

[[step]]
action = "capture"
name = "link-left"
what = "all"

[[step]]
action = "sleep"
seconds = 0.8

# A prompt that is a short URL puts a link on the last row, under the bubble's place.
[[step]]
action = "type"
text = "prompt https://example.com/gx-r6-right/prompt$G$S\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "move"
in = "terminal:0"
x = 8
y = -12

[[step]]
action = "key"
keys = "ctrl"
repeat = 10
delay = 0.1

[[step]]
action = "capture"
name = "link-right"
what = "all"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "resize"
width = 1500
height = 1000

[[step]]
action = "sleep"
seconds = 0.25

[[step]]
action = "capture"
name = "resize-overlay"
what = "all"
