[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "type \"%LOCALAPPDATA%\\osc8-long.txt\"\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "long-link"

# Row 0 is the command line; the label covers the rows below it, well past 90 DIPs.
[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = 90
mods = ["ctrl"]

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
timeout = 5

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "confirm-long"
what = "all"

[[step]]
action = "assert_responsive"
timeout = 2

# Cancel is the default button: move the focus to OK, then activate it.
[[step]]
action = "key"
keys = "left"

[[step]]
action = "key"
keys = "enter"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 5

# The worker hands the missing path to ShellExecute, which fails without any UI.
[[step]]
action = "wait_log"
pattern = "cannot open a URL code=\\d+ len=\\d{4,}"
timeout = 10

[[step]]
action = "assert_responsive"
timeout = 2

[[step]]
action = "activate"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "after-open-attempt"

[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "type \"%LOCALAPPDATA%\\osc8-exec.txt\"\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = 90
mods = ["ctrl"]

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
timeout = 5

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "denied-exec"
what = "all"

[[step]]
action = "assert_log"
pattern = "link held back decision=deny"

# The notice reuses its popup: wait until it timed out before the next refusal.
[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 20

[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "type \"%LOCALAPPDATA%\\osc8-search.txt\"\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = 90
mods = ["ctrl"]

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
timeout = 5

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "denied-search-ms"
what = "all"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 20

[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "type \"%LOCALAPPDATA%\\osc8-unc.txt\"\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = 90
mods = ["ctrl"]

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
timeout = 5

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "confirm-unc"
what = "all"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 5

[[step]]
action = "assert_responsive"
timeout = 2

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "after-cancel"

[[step]]
action = "type"
text = "cls\n"

[[step]]
action = "key"
keys = "ctrl+equal"
repeat = 3
delay = 0.2

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "font-bigger"

[[step]]
action = "key"
keys = "ctrl+shift+o"

[[step]]
action = "wait_terminals"
count = 2

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "inherit-split"