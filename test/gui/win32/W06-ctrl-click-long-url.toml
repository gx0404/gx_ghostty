id = "W06"
title = "Ctrl+click on a 4,100 character link hands it to the shell without hanging the window"
# R0 (W06): a click on a link of more than 4,100 characters must not hang the window; the shell
# gets it on a worker thread (`open_url.zig`). Phase 6 (r6) makes the case safe to run without
# side effects and extends it for R2-App.08/.10: the links are OSC 8 links written by the
# fixture (`type` of files in the isolated profile) and go through the link policy
# (`gx.url_policy`, `App.openLink`): the long local file link asks first, is accepted, and the
# worker's ShellExecute fails on the missing file (logged, nothing opens); an executable and a
# search-ms link are refused with a notice; a link to another computer asks first and is
# cancelled. No web link is clicked, so no browser opens. Then a larger font is inherited by a
# new split.
config = """
command = cmd.exe /d /k prompt $G$S
language = en
"""
expect = [
  "long-link: the label of the OSC 8 link (LONG-FILE-LINK-…, 1,000 characters) fills the top rows of the terminal",
  "confirm-long: Ctrl+click asks first in the themed Open Link? dialog: local files ask first, the target file:///C:/gx-r6-o4-missing/0123… is shown safely (elided or wrapped), OK and the default Cancel buttons",
  "after-open-attempt: after OK the dialog is gone, the window answers and draws normally; nothing was opened (the log says the shell could not open the missing file)",
  "denied-exec: Ctrl+click on the link to notepad.exe opens nothing; a warning notice Link Not Opened at the bottom says executable files are not opened and shows the target",
  "denied-search-ms: the search-ms: link is refused with the same notice naming the scheme as one that is not opened",
  "confirm-unc: the link to a file on another computer (file://gx-r6-nohost/share/readme.txt) asks first",
  "after-cancel: after Esc the dialog is gone and nothing was opened",
  "font-bigger: three Ctrl+= made the text larger",
  "inherit-split: the new right split shows its prompt in the same larger font (window-inherit-font-size)",
]
