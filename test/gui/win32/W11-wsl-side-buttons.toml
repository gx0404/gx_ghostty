id = "W11"
title = "WSL: the side buttons X1 and X2 report SGR buttons 128 and 129, one press and one release each"
requires = ["wsl:Ubuntu-24.04"]
config = """
command = wsl.exe -d Ubuntu-24.04 -e bash --noprofile --norc
language = en
"""
expect = [
  "side-buttons: cat -v shows ^[[<128;…M ^[[<128;…m for X1, then ^[[<129;…M ^[[<129;…m for X2, nothing else",
]

[[step]]
action = "sleep"
seconds = 3.0

[[step]]
action = "type"
text = "printf '\\e[?1000h\\e[?1006h'; cat -v\n"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = "60%"
button = "x1"

[[step]]
action = "sleep"
seconds = 0.4

[[step]]
action = "click"
in = "terminal:0"
x = "50%"
y = "60%"
button = "x2"

[[step]]
action = "sleep"
seconds = 0.6

[[step]]
action = "capture"
name = "side-buttons"
