id = "W03"
title = "Search highlights matches and Esc clears the highlight"
# Microsoft Pinyin takes Ctrl+Shift+F as its simplified/traditional switch, so this scenario opens
# the search bar with F9 (start_search, bound below), a key no input method takes: it needs no
# keyboard layout switch and runs the same with any input method.
config = """
command = cmd.exe /d /k prompt $G$S
language = en
keybind = f9=start_search
"""
expect = [
  "highlight: both needle words in the output are highlighted and the bar counts the matches",
  "cleared: after Esc the search bar is gone and no match is highlighted",
]

[[step]]
action = "type"
text = "echo needle-one and needle-two\n"

[[step]]
action = "key"
keys = "f9"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "type"
text = "needle"

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "highlight"
what = "all"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "capture"
name = "cleared"
