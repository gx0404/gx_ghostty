path = "ghostty/config.ghostty"
text = "command = cmd.exe /d /k prompt $G$S\nlanguage = zh-CN\ntheme = Nord\nkeybind = ctrl+shift+r=reload_config\nkeybind = f6=toggle_tab_overview\nconfirm-close-surface = false\n"

