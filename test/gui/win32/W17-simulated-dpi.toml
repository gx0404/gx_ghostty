id = "W17"
title = "Simulated DPI 96 -> 144 -> 192: the chrome and terminal rescale"
# GHOSTTY_GX_PERF logs surface.resize_wait, renderer.present, profiles.path_scan and the
# popup opening metrics; the run uses them only as log evidence (no timing gate).
env = { GHOSTTY_GX_PERF = "1" }
config = """
command = cmd.exe /d /k prompt $G$S
language = en
window-width = 60
window-height = 20
"""
# The simulated DPI change scales the window around its center like Windows suggests, so a
# large window grows past the screen at 192 dpi: start from a small window and capture with
# PrintWindow, which also renders the parts outside the screen.
# Later phases (R2-接口.01-.03/.06, R2-App.02/.03, R2-Window.02): the main menu at 192 DPI,
# OSC 9;4 progress on the tab (cmd's prompt emits it with $E), split dim and dividers at
# 96 DPI, two reloads (a keybinding change, then a cursor-style-only change with a second
# window open) and a minimize/restore bracketed by DPI log markers, so the log shows
# whether the renderer presented while minimized.
expect = [
  "dpi-96: title bar, tab and terminal text at 100% scale; the tab's brand signature bar is 2 px",
  "dpi-144: everything at 150%: tab bar height, caption buttons and terminal font grow together; the signature bar is 3 px",
  "dpi-192: everything at 200%, nothing clipped or misaligned; the signature bar is 4 px, sharp and inside the tab's corners",
  "menu-dpi-192: the main menu opened at 192 DPI is drawn at 200% like the window (owner scale)",
  "progress-normal: the tab shows a normal (accent) progress ring at 60%",
  "progress-error: the tab's progress ring is red (error) at 60%",
  "progress-cleared: the tab has no progress ring",
  "split-dpi-96: two panes at 96 DPI; the unfocused one stays dimmed and the divider is thin at 100%",
  "reload-toast: after changing a keybinding in the configuration and reloading, the toast Reloaded the configuration shows at the bottom of the window",
  "reload-two-windows: with a second window open, a cursor-style-only reload; the main window's terminals show the bar cursor (outlined while unfocused)",
  "restored: the window was minimized for 3 s and restored by activation; it repaints completely",
]

[[step]]
action = "resize"
width = 1280
height = 720

[[step]]
action = "sleep"
seconds = 0.5

[[step]]
action = "type"
text = "echo scale check\n"

[[step]]
action = "dpi"
value = 96

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "dpi-96"
method = "print"

[[step]]
action = "dpi"
value = 144

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "dpi-144"
method = "print"

[[step]]
action = "dpi"
value = 192

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "dpi-192"
method = "print"

[[step]]
action = "key"
keys = "ctrl+shift+m"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "sleep"
seconds = 0.6

[[step]]
action = "capture"
name = "menu-dpi-192"
what = "all"

[[step]]
action = "key"
keys = "escape"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false

[[step]]
action = "dpi"
value = 144

[[step]]
action = "sleep"
seconds = 0.8

# R2-接口.03: OSC 9;4 progress (ESC ] 9 ; 4 ; state ; percent ST) from cmd's prompt.
[[step]]
action = "type"
text = 'prompt $E]9;4;1;60$E\$G$S'

[[step]]
action = "key"
keys = "enter"

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "progress-normal"

[[step]]
action = "type"
text = 'prompt $E]9;4;2;60$E\$G$S'

[[step]]
action = "key"
keys = "enter"

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "progress-error"

[[step]]
action = "type"
text = 'prompt $E]9;4;0;0$E\$G$S'

[[step]]
action = "key"
keys = "enter"

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "capture"
name = "progress-cleared"

[[step]]
action = "type"
text = 'prompt $G$S'

[[step]]
action = "key"
keys = "enter"

# R2-接口.02: the dim of the unfocused split follows the DPI change.
[[step]]
action = "key"
keys = "ctrl+shift+o"

[[step]]
action = "wait_terminals"
count = 2

[[step]]
action = "sleep"
seconds = 0.6

[[step]]
action = "dpi"
value = 96

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "split-dpi-96"
method = "print"

[[step]]
action = "dpi"
value = 144

[[step]]
action = "sleep"
seconds = 0.8

# R2-App.02: a keybinding change reprobes the shortcut conflicts on reload.
[[step]]
action = "file"
path = "ghostty/config.ghostty"
text = """
command = cmd.exe /d /k prompt $G$S
language = en
window-width = 60
window-height = 20
keybind = ctrl+shift+f11=new_tab
confirm-close-surface = false
"""

[[step]]
action = "key"
keys = "ctrl+shift+comma"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
new = true

[[step]]
action = "sleep"
seconds = 0.4

[[step]]
action = "capture"
name = "reload-toast"
what = "all"

[[step]]
action = "wait_popup"
cls = "GhosttyGxPopup"
present = false
timeout = 6

# R2-App.03: with two windows, a reload that only changes the cursor style.
[[step]]
action = "key"
keys = "ctrl+shift+n"

[[step]]
action = "sleep"
seconds = 2.0

[[step]]
action = "file"
path = "ghostty/config.ghostty"
text = """
command = cmd.exe /d /k prompt $G$S
language = en
window-width = 60
window-height = 20
keybind = ctrl+shift+f11=new_tab
cursor-style = bar
confirm-close-surface = false
"""

[[step]]
action = "key"
keys = "ctrl+shift+comma"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "capture"
name = "reload-two-windows"
method = "print"

[[step]]
action = "key"
keys = "ctrl+shift+w"

[[step]]
action = "sleep"
seconds = 1.5

[[step]]
action = "activate"

[[step]]
action = "sleep"
seconds = 0.5

# R2-Window.02: DPI log markers around 3 s visible (the cursor blinks, so frames present) and
# 3 s minimized (the log should show no renderer.present until the restore).
[[step]]
action = "dpi"
value = 144

[[step]]
action = "sleep"
seconds = 3.0

[[step]]
action = "dpi"
value = 144

[[step]]
action = "click"
x = -115
y = 20

[[step]]
action = "sleep"
seconds = 3.0

[[step]]
action = "activate"

[[step]]
action = "sleep"
seconds = 1.0

[[step]]
action = "dpi"
value = 144

[[step]]
action = "sleep"
seconds = 0.8

[[step]]
action = "capture"
name = "restored"
method = "print"