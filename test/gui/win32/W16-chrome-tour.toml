id = "W16"
title = "Chrome tour: caption, window and main menus, shortcuts sheet, context menus, settings and About"
# One instance walks the chrome in phases: A caption buttons, tooltips and the window
# menu; B the main menu from the button and the keyboard, submenus and access keys; C the
# keyboard shortcut sheet (search, recording, Enter, Ctrl+End, wheel, owner scale); D the
# terminal and tab context menus; E the settings overlay (sections, focus ring, list
# filter, search, change and reset, font loading, wheel, narrow layout); F the About dialog;
# G a light theme. The window is resized to 1920x1200 (1280x800 DIP at 144 DPI): caption
# buttons at x = -115, -69, -23 DIP, the main menu button at x = -160, all at y = 20.
# Win+E is held by Explorer, so its global binding cannot register (a shortcut conflict).
env = { GHOSTTY_GX_PERF = "1" }
config = """
command = cmd.exe /d /k prompt $G$S
language = en
window-width = 90
window-height = 28
cursor-style = bar
keybind = global:super+e=new_tab
"""
expect = [
  "caption-tooltip-minimize: the pointer rests on the minimize button, which shows its hover fill, and a tooltip says Minimize",
  "caption-tooltip-maximize: a tooltip says Maximize over the hovered maximize button",
  "caption-close-hover: the window close button is hovered in red (D5), unlike the neutral tab close",
  "caption-minimize-pressed: the minimize button is held down: its fill looks like the hover fill",
  "caption-pressed-pointer-away: the button is still held but the pointer left it: no pressed look, nothing happened",
  "caption-tooltip-restore: the window is maximized and the middle caption button's tooltip says Restore Down",
  "system-menu-keyboard: Alt+Space opened the custom-drawn window menu (Restore, Move, Size, Minimize, Maximize, Close) at the top left of the window",
  "system-menu-caption: a right click on the empty title bar opened the same window menu at the pointer",
  "inactive-main: a second window took the activation; the main window's title bar and tab text show the inactive colors",
  "active-main-again: the second window is closed and the main window is active again with the active colors",
  "main-menu-click: the main menu opened below the main menu button, its right edge lined up with the button's right edge",
  "main-menu-keyboard: Ctrl+Shift+M opens the same menu at the same place with the first item highlighted and access keys underlined",
  "profile-submenu: Down twice and Right opened New Tab with Profile: launch profiles with their kind icons, the default tagged",
  "submenu-parent-hot: Left closed the submenu and New Tab with Profile is highlighted again in the main menu",
  "keybinds-from-access-key: K picked Keyboard Shortcuts: the sheet lists categories in order with key caps; the notice at the top names the taken keys (Win+E taken by another program) once per reason and their rows show a warning icon",
  "keybinds-query-split: the query split keeps the split rows, ordered by score within their category",
  "keybinds-recorded: Alt+K recorded Ctrl+Shift+T into the field as a key query; only the New Tab row is listed",
  "keybinds-row-selected: Down selected the New Tab row",
  "new-tab-from-sheet: Enter closed the sheet and ran New Tab: the window has two tabs",
  "keybinds-ctrl-end: Ctrl+End selected the last row and scrolled the list to the end, the scroll bar thumb at the bottom",
  "keybinds-wheel: the wheel scrolled the list back up; the row under the pointer is hovered",
  "keybinds-dpi-96: after a simulated 96 DPI the sheet opens at 100% scale (smaller text and key caps)",
  "context-menu-dpi-96: the terminal context menu at 96 DPI is drawn at 100% as well",
  "settings-dpi-96: the settings overlay opened at 96 DPI lays out at the window's scale (100%)",
  "context-menu-flipped: a right click near the bottom right of the terminal opened its menu above and to the left of the pointer so it fits on the screen",
  "context-split-submenu: the context menu of a split: S opened Split with Move Split to New Tab and Move Split to New Window enabled",
  "context-moved-split: M moved the split into a new tab; the window shows one pane",
  "tab-context-menu: right click on the first tab: Rename Tab, Close Tab, Close Other Tabs, Close Tabs to the Right, Move Tab to New Window, Duplicate Tab, New Tab",
  "settings-language: the settings overlay over a dimmed window, Language selected, its two choices",
  "settings-appearance: Tab switched to Appearance: theme list, window material choices (unsupported ones disabled with the reason), opacity Auto/100/90/80/70, padding, cursor style with From the configuration file, cursor blink",
  "settings-focus-ring: Down moved the keyboard focus, which shows a focus ring",
  "settings-theme-filter: typing dra went into the theme filter box and the list shows only matching themes",
  "settings-esc-clears-filter: the first Escape cleared the filter; the overlay is still open",
  "settings-search: F6 and the query cursor style list the matching setting in the sidebar search",
  "settings-search-revealed: Enter revealed Cursor Style on the Appearance page with the focus on it and the query cleared",
  "settings-cursor-changed: Right changed the cursor style; it is saved and the reset button shows next to the setting",
  "settings-cursor-reset: Delete removed the setting from the settings file; the value is Bar from the configuration file again and the reset button is gone",
  "settings-font-loading: right after switching to Font the status says Loading font families or shows the last list",
  "settings-font: the font size stepper, the font sample and the font family list",
  "settings-font-size-stepped: Right stepped the font size up by one; the sample and the terminal behind grew",
  "settings-interaction: right-click action with its five choices as radio rows, scroll bar, close confirmation, focus follows mouse, Ctrl+wheel zoom and the bell features Windows supports",
  "settings-wheel: one wheel notch scrolled the page by the system's lines",
  "settings-pagedown: PgDn scrolled the page further",
  "settings-shell: the default shell choices with their commands",
  "settings-about: version, notice, Graphics with the OpenGL backend, the configuration and settings file paths shortened in the middle, and the buttons",
  "settings-narrow: in a narrow window the overlay keeps its 640 DIP minimum and choice chips wrap below their titles",
  "about-dialog: About Ghostty GX: OK is the default button in the accent color, the three links are underlined with an external-link icon, the version and the graphics backend are listed",
  "main-menu-light: after picking the light theme Catppuccin Latte the main menu is light and its surface is lifted toward white",
  "light-chrome: the light title bar and tabs with readable inactive tab text",
]

