id = "G26"
title = "D-15: reverting a theme whose saving failed drops it, so no later save writes it"
lang = "en"
config = """
command = direct:/bin/bash --noprofile --norc
language = en
confirm-close-surface = false
env = HISTFILE=/dev/null
keybind = ctrl+alt+t=gx:settings_page:appearance
"""
script = '''
import os
folder = config_home / "ghostty"
overlay = folder / "gui-settings.ghostty"
def overlay_text():
    return overlay.read_text() if overlay.exists() else ""
def read_only(on):
    os.chmod(folder, 0o555 if on else 0o755)
    if overlay.exists():
        os.chmod(overlay, 0o444 if on else 0o644)
def search(query):
    xdo("mousemove", 400, 96, "click", 1)
    xdo("key", "ctrl+a")
    xdo("type", "--delay", 1, query)
    sleep(1.0)
def theme_list():
    xdo("mousemove", 550, 170, "click", 1)
    sleep(0.8)
def apply_theme():
    xdo("mousemove", 845, 96, "click", 1)
    sleep(0.8)
def revert():
    xdo("mousemove", 755, 96, "click", 1)
    sleep(0.8)
def back():
    xdo("mousemove", 113, 58, "click", 1)
    sleep(0.8)
def close():
    xdo("mousemove", 987, 59, "click", 1)
    sleep(0.8)
def open_appearance():
    xdo("mousemove", 400, 300, "click", 1)
    xdo("key", "ctrl+alt+t")
    sleep(0.8)
xdo("windowsize", window(), 1100, 740)
open_appearance()
theme_list()
search("Chalkboard")
capture("01-preview")
read_only(True)
try:
    apply_theme()
    capture("02-save-failed")
    assert "Chalkboard" not in overlay_text()
    revert()
    capture("03-reverted")
    # Nothing is left to save, so the dialog closes while the folder is
    # still read-only.
    close()
    capture("04-closed")
finally:
    read_only(False)
text = overlay_text()
save("-overlay.txt", text)
assert "Chalkboard" not in text, text
open_appearance()
capture("05-reopened")

# A later save in the same opening leaves the reverted theme out.
theme_list()
search("Chalkboard")
read_only(True)
try:
    apply_theme()
    revert()
finally:
    read_only(False)
back()
xdo("mousemove", 800, 507, "click", 1)
sleep(1.2)
capture("06-later-save")
text = overlay_text()
save("-overlay-later.txt", text)
assert "cursor-style-blink" in text and "Chalkboard" not in text, text

# Selecting the saved theme again reverts as well: nothing is left to
# save and the dialog closes while the folder is still read-only.
theme_list()
search("Chalkboard")
read_only(True)
try:
    apply_theme()
    capture("07-save-failed-again")
    search("GX Mocha")
    capture("08-saved-theme-selected")
    close()
    capture("09-closed")
finally:
    read_only(False)
assert "Chalkboard" not in overlay_text()

# Retry while another theme stays previewed saves the failed theme and
# shows it as saved; the other theme stays previewed.
open_appearance()
theme_list()
search("Chalkboard")
read_only(True)
try:
    apply_theme()
    search("Chalk")
    xdo("key", "Up")
    sleep(1.0)
    capture("10-other-previewed")
finally:
    read_only(False)
xdo("mousemove", 738, 657, "click", 1)
sleep(1.0)
capture("11-retried")
text = overlay_text()
save("-overlay-retried.txt", text)
assert "theme = Chalkboard" in text, text
back()
capture("12-theme-row")
close()
'''
expect = [
  "G26.png: the isolated terminal before the settings open",
  "G26-01-preview.png: the theme list searched for Chalkboard previews it in the terminal; Revert and Apply are sensitive",
  "G26-02-save-failed.png: with the settings folder read-only, Apply shows the failure toast with Retry and Chalkboard stays previewed",
  "G26-03-reverted.png: Revert brings the saved theme back in the terminal; the retry toast is gone and Apply/Revert are insensitive",
  "G26-04-closed.png: with the folder still read-only, the close button closes the dialog without a failure toast",
  "G26-overlay.txt: after the folder became writable again the settings file has no theme = Chalkboard: nothing saved the reverted theme",
  "G26-05-reopened.png: the appearance page shows the saved theme, not Chalkboard",
  "G26-06-later-save.png: after another failed Apply, Revert and going back, turning Blinking Cursor off is saved (Settings saved) and the terminal keeps the saved theme",
  "G26-overlay-later.txt: cursor-style-blink = false and no theme = Chalkboard",
  "G26-07-save-failed-again.png: Apply with the folder read-only fails again with Retry",
  "G26-08-saved-theme-selected.png: searching for the saved GX Mocha selects it with its check mark and reverts: the retry toast is gone, Revert and Apply are insensitive, the terminal shows GX Mocha",
  "G26-09-closed.png: with the folder still read-only the close button closes the dialog without a failure toast",
  "G26-10-other-previewed.png: after a failed Apply of Chalkboard, the search Chalk lists Chalk and Chalkboard; Chalk is selected and previewed and the retry toast stays",
  "G26-11-retried.png: Retry with the folder writable saves Chalkboard: it gets the check mark, Chalk stays selected and previewed, Revert and Apply stay sensitive, the toast says the settings are saved",
  "G26-overlay-retried.txt: theme = Chalkboard",
  "G26-12-theme-row.png: going back ends the preview: the terminal and the theme row show Chalkboard",
]
