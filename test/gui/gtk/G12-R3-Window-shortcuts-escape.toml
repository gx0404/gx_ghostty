id = "G12"
title = "R3-Window: Escape clears shortcuts search then closes the dialog and returns keyboard focus"
lang = "en"
config = """
command = /bin/bash --noprofile --norc
language = en
"""
xdotool = """
mousemove 400 300
click 1
sleep 0.3
key ctrl+shift+slash
sleep 1
type --delay 20 "split"
sleep 0.5
key Escape
sleep 0.5
key Escape
sleep 0.7
type --delay 20 "echo R3-ESC-OK"
key Return
sleep 0.5
"""
expect = ["G12-after.png: the dialog is closed and R3-ESC-OK appears in the terminal, proving focus returned"]
