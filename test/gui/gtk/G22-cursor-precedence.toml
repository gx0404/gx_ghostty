id = "G22"
title = "Bash and Zsh prompt cursor versus configuration, gx-prompt-cursor and DECSCUSR"
lang = "en"
config = """
command = direct:/bin/bash --noprofile --norc
language = en
confirm-close-surface = false
env = HISTFILE=/dev/null
"""
script = '''
import shlex
import os
import signal
import select
import termios
import time
import uuid
private_home = config_home / "shell-home"
private_home.mkdir()
integration_file = private_home / "integration.txt"
(private_home / ".zshrc").write_text("PROMPT='R6-ZSH%# '\nprintf '%s\\n' \"$GHOSTTY_SHELL_FEATURES|$_ghostty_state\" > \"$HOME/integration.txt\"\n")
# Set inherited environment before launching Ghostty. Config env=ZDOTDIR is
# applied after automatic injection and would deliberately override its path.
os.environ.update(HOME=str(private_home), ZDOTDIR=str(private_home), HISTFILE="/dev/null")
# Zsh starts with vi bindings when EDITOR or VISUAL mentions vi; every case
# below selects its key bindings explicitly instead.
for name in ("EDITOR", "VISUAL"):
    os.environ.pop(name, None)
probe = private_home / "cursor_probe.py"
probe.write_text("""import os,sys,termios,tty,select,time,json
from pathlib import Path
def query(request):
 os.write(1,request+b'\\x1bP$q q\\x1b\\\\')
 result=b''
 end=time.monotonic()+3
 while time.monotonic()<end:
  if select.select([0],[],[],0.1)[0]:
   result+=os.read(0,1024)
   if result.endswith(b'\\x1b\\\\'): break
 return result.hex()
old=termios.tcgetattr(0)
try:
 tty.setraw(0)
 start=query(b'')
 code=int(sys.argv[2]) if len(sys.argv)>2 else 2
 response=query(('\\x1b[%d q'%code).encode())
 Path(sys.argv[1]).write_text(json.dumps({'request':'DECSCUSR '+str(code),'pid':os.getpid(),'start_hex':start,'response_hex':response}))
 os.write(1,b'\\r\\nGX0057 CURSOR PROBE; PRESS ENTER\\r\\n')
 os.read(0,1)
finally:
 termios.tcsetattr(0,termios.TCSANOW,old)
""")

reload_probe_source = r"""import json,os,select,sys,termios,time,tty
from pathlib import Path

def process_identity(pid):
 fields=Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
 return dict(pid=pid,state=fields[0],ppid=int(fields[1]),pgrp=int(fields[2]),tpgid=int(fields[5]),birth=int(fields[19]))

def foreground_identity():
 current=process_identity(os.getpid())
 assert current['state'] not in ('T','t','Z','X'),current
 assert current['pgrp']==current['tpgid']==os.tcgetpgrp(0),current
 return current

def validate_request(request,identity,run,stage,last_nonce):
 assert request['run']==run,request
 assert (request['pid'],request['birth'])==(identity['pid'],identity['birth']),request
 assert isinstance(request['nonce'],str) and request['nonce'] and request['nonce']!=last_nonce,request
 assert (request['op'],request['stage']) in (('query',stage),('stop','stop')),request

def query_cursor(request):
 deadline=request['issued']+3
 assert time.monotonic()<deadline,'query request expired before dispatch'
 os.write(1,b'\x1bP$q q\x1b\\')
 response=b''
 while time.monotonic()<deadline:
  if select.select([0],[],[],min(0.1,max(0,deadline-time.monotonic())))[0]:
   try:
    response+=os.read(0,1024)
   except BlockingIOError:
    continue
   if time.monotonic()>=deadline: break
   if response.endswith(b'\x1b\\'): return response
 raise TimeoutError('cursor response deadline expired: '+response.hex())

def atomic_json(path,value):
 temporary=path.with_name(path.name+'.tmp')
 temporary.write_text(json.dumps(value))
 temporary.replace(path)

def main():
 control=Path(sys.argv[1]);run=sys.argv[2]
 identity=foreground_identity()
 assert identity['ppid']==int(sys.argv[3]),identity
 old=termios.tcgetattr(0);blocking=os.get_blocking(0)
 request={}
 try:
  tty.setraw(0);os.set_blocking(0,False)
  # The only style request in this process. All later phases only query.
  os.write(1,b'\x1b[2J\x1b[H\x1b[4 qGX0057 RELOAD PROBE ACTIVE\r\n')
  atomic_json(control/'ready.json',dict(run=run,**identity))
  last_nonce=None;index=0
  stages=('reload-before','reload-explicit','reload-removed','stop')
  while True:
   try:
    request=json.loads((control/'request.json').read_text())
   except FileNotFoundError:
    time.sleep(0.01);continue
   if request['nonce']==last_nonce:
    time.sleep(0.01);continue
   validate_request(request,identity,run,stages[index],last_nonce)
   before=foreground_identity()
   assert before['birth']==identity['birth'] and before['ppid']==identity['ppid'],before
   result=dict(run=run,stage=request['stage'],nonce=request['nonce'],pid=identity['pid'],birth=identity['birth'],issued=request['issued'],before=before)
   output=control/(request['stage']+'-'+request['nonce']+'.json')
   if request['op']=='stop':
    atomic_json(output,dict(result,stopped=True));return
   response=query_cursor(request)
   assert response.startswith(b'\x1bP1$r') and response.endswith(b' q\x1b\\'),response
   value=int(response[len(b'\x1bP1$r'):-len(b' q\x1b\\')])
   after=foreground_identity()
   assert after['birth']==identity['birth'] and after['ppid']==identity['ppid'],after
   os.write(1,('GX0057 '+request['stage']+' PID '+str(identity['pid'])+' VALUE '+str(value)+'\r\n').encode())
   atomic_json(output,dict(result,after=after,response_hex=response.hex(),value=value,finished=time.monotonic()))
   last_nonce=request['nonce'];index+=1
 except BaseException as error:
  atomic_json(control/'failure.json',dict(run=run,pid=identity['pid'],birth=identity['birth'],request=request,error=repr(error)))
  raise
 finally:
  os.set_blocking(0,blocking)
  termios.tcsetattr(0,termios.TCSANOW,old)

if __name__=='__main__':main()
"""
def decrqss(response):
    prefix, suffix = b"\x1bP1$r", b" q\x1b\\"
    assert response.startswith(prefix) and response.endswith(suffix), response
    return int(response[len(prefix):-len(suffix)])
def prompt_cursor(label, identity):
    # Freeze only the owned shell's input reader. Query through its PTY slave
    # without executing a command, so preexec cannot mask the prompt's state.
    def state():
        fields = Path(f"/proc/{identity['pid']}/stat").read_text().rsplit(")", 1)[1].split()
        assert int(fields[19]) == identity["birth"], "shell PID was reused"
        return fields[0]
    state()
    handle = os.pidfd_open(identity["pid"])
    terminal = None
    stopped = False
    try:
        state()
        terminal = os.open(identity["fd0"], os.O_RDWR | os.O_NOCTTY | os.O_NONBLOCK)
        assert not termios.tcgetattr(terminal)[3] & termios.ICANON, "shell is not reading a prompt"
        signal.pidfd_send_signal(handle, signal.SIGSTOP)
        stopped = True
        for _ in range(100):
            if state() == "T": break
            sleep(0.01)
        assert state() == "T", "owned shell did not stop"
        os.write(terminal, b"\x1bP$q q\x1b\\")
        response = b""
        deadline = time.monotonic() + 3
        while time.monotonic() < deadline:
            if select.select([terminal], [], [], min(0.1, max(0, deadline - time.monotonic())))[0]:
                try:
                    response += os.read(terminal, 1024)
                except BlockingIOError:
                    continue
                if time.monotonic() >= deadline:
                    raise TimeoutError("prompt cursor response deadline expired: " + response.hex())
                if response.endswith(b"\x1b\\"): break
        value = decrqss(response)
        save("-" + label + "-prompt-query.json", json.dumps({"identity":identity,"response_hex":response.hex(),"value":value},indent=2))
        return value
    finally:
        if stopped:
            try:
                signal.pidfd_send_signal(handle, signal.SIGCONT)
            except ProcessLookupError:
                pass
        if terminal is not None:
            os.close(terminal)
        os.close(handle)
config_file = config_home / "ghostty/config.ghostty"
def configure(shell, settings):
    command = "direct:/bin/bash --noprofile --norc" if shell == "bash" else "direct:/usr/bin/zsh -d"
    config_file.write_text(f"language = en\ncommand = {command}\nconfirm-close-surface = false\nenv = HISTFILE=/dev/null\n{settings}")
def start(label, shell, extra=None, integrated=True):
    integration_file.unlink(missing_ok=True)
    xdo("mousemove", 400, 300, "click", 1)
    restart(args=extra)
    if shell == "zsh" and integrated:
        for _ in range(50):
            if integration_file.exists(): break
            sleep(0.1)
        integration = integration_file.read_text()
        assert "|0" in integration, integration
        save("-" + label + "-integration.txt", integration)
    xdo("mousemove", 400, 300, "click", 1)
    sleep(0.2)
    capture(label + "-prompt")
    shells = [row for row in processes(label + "-shell") if Path(row["exe"]).name == shell]
    assert len(shells) == 1, shells
    return shells[0]
def check_features(label, identity, cursor_features):
    # The environment Ghostty gave the shell: upstream setupFeatures, plus the
    # GX feature right after the cursor feature for gx-prompt-cursor = config.
    environ = Path(f"/proc/{identity['pid']}/environ").read_bytes().split(b"\0")
    values = [item.split(b"=", 1)[1].decode() for item in environ if item.startswith(b"GHOSTTY_SHELL_FEATURES=")]
    features = values[0].split(",") if values else []
    save("-" + label + "-features.json", json.dumps(features))
    assert [feature for feature in features if feature.startswith("cursor")] == cursor_features, (label, features)
def run_program(label, expected=2, request=2, hold=False):
    output = evidence / (label + "-query.json")
    xdo("type", "--clearmodifiers", "--delay", 1, "python3 " + shlex.quote(str(probe)) + " " + shlex.quote(str(output)) + " " + str(request))
    xdo("key", "Return")
    for _ in range(60):
        if output.exists(): break
        sleep(0.1)
    assert output.exists(), label
    result = json.loads(output.read_text())
    assert decrqss(bytes.fromhex(result["response_hex"])) == expected, result
    capture(label + "-tui")
    if hold:
        return result, decrqss(bytes.fromhex(result["start_hex"]))
    xdo("key", "Return")
    sleep(0.4)
    return result, decrqss(bytes.fromhex(result["start_hex"]))
def command(text):
    xdo("type", "--clearmodifiers", "--delay", 1, text)
    xdo("key", "Return")
    sleep(0.5)
def expect_prompt(label, identity, expected):
    value = prompt_cursor(label, identity)
    assert value == expected, (label, expected, value)
    capture(label)
    return value

def reload_owner(identity, shell):
    def inspect(pid):
        fields = Path(f"/proc/{pid}/stat").read_text().rsplit(")", 1)[1].split()
        return dict(pid=pid, state=fields[0], ppid=int(fields[1]), pgrp=int(fields[2]),
                    tpgid=int(fields[5]), birth=int(fields[19]))
    child, parent = inspect(identity["pid"]), inspect(shell["pid"])
    assert child["birth"] == identity["birth"] and child["ppid"] == shell["pid"], child
    assert parent["birth"] == shell["birth"], parent
    assert child["state"] not in ("T", "t", "Z", "X"), child
    assert child["pgrp"] > 0 and child["pgrp"] == child["tpgid"] == parent["tpgid"], (child, parent)
    assert parent["pgrp"] != child["pgrp"] and parent["state"] in ("S", "D"), (child, parent)
    return {"probe": child, "waiting_shell": parent}

def reload_query(control, run, identity, shell, stage, expected=None):
    before = reload_owner(identity, shell)
    nonce = uuid.uuid4().hex
    issued = time.monotonic()
    request = dict(run=run, pid=identity["pid"], birth=identity["birth"], stage=stage,
                   nonce=nonce, issued=issued, op="stop" if stage == "stop" else "query")
    temporary = control / "request.tmp"
    temporary.write_text(json.dumps(request))
    temporary.replace(control / "request.json")
    response_file = control / (stage + "-" + nonce + ".json")
    deadline = issued + 3
    while time.monotonic() < deadline:
        if (control / "failure.json").exists():
            raise AssertionError((control / "failure.json").read_text())
        if response_file.exists():
            response = json.loads(response_file.read_text())
            save("-" + stage + "-probe-response.json", json.dumps(response, indent=2))
            for key in ("run", "pid", "birth", "stage", "nonce", "issued"):
                assert response[key] == request[key], (key, request, response)
            if stage == "stop":
                assert response["stopped"] is True, response
                return response
            assert response["finished"] <= deadline, response
            after = reload_owner(identity, shell)
            assert decrqss(bytes.fromhex(response["response_hex"])) == response["value"] == expected, response
            for snapshot in (response["before"], response["after"]):
                assert snapshot["pid"] == identity["pid"] and snapshot["birth"] == identity["birth"], response
                assert snapshot["ppid"] == shell["pid"] and snapshot["pgrp"] == snapshot["tpgid"], response
                assert snapshot["state"] not in ("T", "t", "Z", "X"), response
            capture(stage)
            after_capture = reload_owner(identity, shell)
            save("-" + stage + "-ownership.json", json.dumps(dict(before=before, after=after, after_capture=after_capture), indent=2))
            return response["value"]
        sleep(min(0.01, max(0, deadline - time.monotonic())))
    raise TimeoutError("reload probe response deadline expired: " + stage + " " + nonce)

def run_reload_case():
    # Keep one foreground process throughout. SIGSTOP would hand the terminal
    # back to Bash and invalidate the claimed program/reload evidence.
    settings = "shell-integration=none\nkeybind=f12=reload_config\n"
    configure("bash", settings)
    shell = start("reload", "bash", extra=[], integrated=False)
    run = uuid.uuid4().hex
    control = private_home / ("reload-control-" + run)
    control.mkdir(mode=0o700)
    reload_probe = private_home / "reload_probe.py"
    reload_probe.write_text(reload_probe_source)
    xdo("type", "--clearmodifiers", "--delay", 1,
        "python3 " + shlex.quote(str(reload_probe)) + " " + shlex.quote(str(control)) + " " + run + " " + str(shell["pid"]))
    xdo("key", "Return")
    for _ in range(60):
        if (control / "ready.json").exists(): break
        sleep(0.1)
    ready = json.loads((control / "ready.json").read_text())
    assert ready["run"] == run and ready["ppid"] == shell["pid"], ready
    identity = next(row for row in processes("reload-probe") if row["pid"] == ready["pid"])
    assert identity["birth"] == ready["birth"], (identity, ready)
    record = dict(case="reload", run=run, probe=identity, shell=shell,
                  before=reload_query(control, run, identity, shell, "reload-before", 4))
    configure("bash", settings + "cursor-style=block\ncursor-style-blink=true\n")
    xdo("key", "F12")
    sleep(0.5)
    record["explicit_equal_default"] = reload_query(control, run, identity, shell, "reload-explicit", 1)
    configure("bash", settings)
    xdo("key", "F12")
    sleep(0.5)
    record["removed"] = reload_query(control, run, identity, shell, "reload-removed", 4)
    record["stop"] = reload_query(control, run, identity, shell, "stop")
    sleep(0.4)
    return record

results = []
for shell in ("bash", "zsh"):
    for feature in ("cursor", "no-cursor"):
        for style in ("block", "bar", "underline"):
            for blink in (False, True):
                label = f"{shell}-{feature}-{style}-{'blink' if blink else 'steady'}"
                configure(shell, f"cursor-style = {style}\ncursor-style-blink = {str(blink).lower()}\nshell-integration-features = {feature}\n")
                identity = start(label, shell)
                hint = "cursor:blink" if blink else "cursor:steady"
                check_features(label, identity, [hint, "cursor:config"] if feature == "cursor" else [])
                configured = {"block":1,"underline":3,"bar":5}[style] + (0 if blink else 1)
                initial_cursor = prompt_cursor(label + "-initial", identity)
                assert initial_cursor == configured, (label, configured, initial_cursor)
                if blink:
                    xdo("type", "x")
                    xdo("key", "BackSpace")
                    sleep(0.03)
                    capture(label + "-prompt-active")
                    sleep(0.65)
                    capture(label + "-prompt-idle")
                result, program_start = run_program(label, configured)
                # A program that requests no style of its own starts with the configured one.
                assert program_start == configured, (label, configured, program_start)
                returned_cursor = prompt_cursor(label + "-returned", identity)
                assert returned_cursor == configured, (label, configured, returned_cursor)
                capture(label + "-returned")
                results.append({"case":label,"configured_style":style,"configured_blink":blink,"feature":feature,"shell":shell,
                                "prompt_before":initial_cursor,"program_start":program_start,"prompt_returned":returned_cursor,**result})
save("-cursor-matrix.json", json.dumps(results,indent=2))
modes = []
def zsh_bindings(label, settings, cursor_features, emacs, insert, command_mode):
    configure("zsh", settings)
    identity = start(label, "zsh")
    check_features(label, identity, cursor_features)
    record = {"case":label,"settings":settings,"emacs":expect_prompt(label + "-emacs", identity, emacs)}
    command("KEYTIMEOUT=1; bindkey -v")
    record["vi_insert"] = expect_prompt(label + "-vi-insert", identity, insert)
    xdo("key", "Escape")
    sleep(0.3)
    record["vi_command"] = expect_prompt(label + "-vi-command", identity, command_mode)
    xdo("key", "i")
    sleep(0.3)
    record["vi_insert_again"] = expect_prompt(label + "-vi-insert-again", identity, insert)
    command("bindkey -e")
    record["emacs_again"] = expect_prompt(label + "-emacs-again", identity, emacs)
    modes.append(record)
# Explicit shape and blink win in all zsh keymaps. With no explicit setting,
# the GX defaults still allow the upstream vi mode indication.
zsh_bindings("zsh-underline-steady", "cursor-style = underline\ncursor-style-blink = false\nshell-integration-features = cursor\n",
             ["cursor:steady", "cursor:config"], 4, 4, 4)
# The GX default blinking block keeps the vi modes distinguishable.
zsh_bindings("zsh-gx-default", "shell-integration-features = cursor\n", ["cursor:blink", "cursor:config"], 1, 5, 1)
# gx-prompt-cursor = bar is upstream: a bar at every prompt, vi modes as above.
zsh_bindings("zsh-prompt-bar", "gx-prompt-cursor = bar\nshell-integration-features = cursor\n", ["cursor:blink"], 5, 5, 1)
# With gx-prompt-cursor = bar, programs still start with the configured
# cursor-style (the GX default blinking block) and the prompt returns to a bar.
for shell in ("bash", "zsh"):
    label = shell + "-prompt-bar-program"
    configure(shell, "gx-prompt-cursor = bar\nshell-integration-features = cursor\n")
    identity = start(label, shell)
    check_features(label, identity, ["cursor:blink"])
    record = {"case":label,"prompt_before":expect_prompt(label + "-initial", identity, 5)}
    # The blinking bar may be in its off phase; a key press shows it.
    xdo("type", "x")
    xdo("key", "BackSpace")
    sleep(0.03)
    capture(label + "-prompt-active")
    result, record["program_start"] = run_program(label)
    assert record["program_start"] == 1, record
    record["prompt_returned"] = expect_prompt(label + "-returned", identity, 5)
    modes.append(record | result)
save("-modes.json", json.dumps(modes,indent=2))
# Independently explicit shape/blink, shell integration off, include/GUI/CLI,
# and equal-to-default values. These are terminal requests, not renderer masks.
priority = []
for name, settings, extra, expected in (
    ("unset", "", [], 2),
    ("shape-only", "cursor-style=underline\n", [], 4),
    ("blink-only", "cursor-style-blink=true\n", [], 1),
    ("equal-default", "cursor-style=block\ncursor-style-blink=true\n", [], 1),
    ("prompt-bar-conflict", "gx-prompt-cursor=bar\ncursor-style=underline\ncursor-style-blink=true\n", [], 3),
    ("empty-shape", "cursor-style=\n", [], 2),
    ("empty-blink", "cursor-style-blink=\n", [], 2),
    ("cli", "cursor-style=underline\n", ["--cursor-style=bar", "--cursor-style-blink=true"], 5),
):
    for integrated in (False, True):
        label = "priority-" + name + ("-integration" if integrated else "-none")
        configure("bash", settings + ("" if integrated else "shell-integration=none\n"))
        start(label, "bash", extra=extra, integrated=integrated)
        result, _ = run_program(label, expected)
        priority.append({"case":label,"expected":expected,**result})
# Nested include remains below GUI, and CLI remains above both.
include_file = config_file.parent / "cursor-include.ghostty"
include_file.write_text("cursor-style=underline\ncursor-style-blink=false\n")
overlay_file = config_file.parent / "gui-settings.ghostty"
configure("bash", "config-file=cursor-include.ghostty\n")
for label, overlay, extra, expected in (
    ("include", "", [], 4),
    ("overlay", "cursor-style=bar\ncursor-style-blink=true\n", [], 5),
    ("cli-over-overlay", "cursor-style=bar\ncursor-style-blink=true\n", ["--cursor-style=block", "--cursor-style-blink=false"], 2),
):
    overlay_file.write_text(overlay)
    start(label, "bash", extra=extra)
    result, _ = run_program(label, expected)
    priority.append({"case":label,"expected":expected,**result})
overlay_file.unlink()
priority.append(run_reload_case())
save("-explicit-priority.json", json.dumps(priority,indent=2))

'''
expect = [
  "G22.png: an isolated initial Bash terminal",
  "*-prompt.png: each case's first prompt; in the bash/zsh x cursor/no-cursor x block/bar/underline x blink/steady matrix the configured cursor shows and the direct PTY query must match",
  "*-prompt-active.png and *-prompt-idle.png: blinking cases include a key-woken frame and a later frame",
  "*-tui.png: DECSCUSR requests are constrained only by successfully parsed explicit shape/blink; query JSON records the actual effective state",
  "*-returned.png: explicit settings remain effective even with no-cursor; unconfigured cases retain program and integration behavior",
  "G22-zsh-underline-steady-*.png: the explicit steady underline remains in emacs, vi insert and vi command modes",
  "G22-zsh-gx-default-*.png: with the GX default blinking block, emacs bindings show a block, vi insert a bar and vi command mode a block",
  "G22-zsh-prompt-bar-*.png and G22-*-prompt-bar-program-*.png: gx-prompt-cursor = bar shows upstream's blinking bar at the prompt (visible in *-prompt-active.png and in frames caught in the on phase); the TUI starts with the configured blinking block",
  "G22-reload-before/explicit/removed.png: the same foreground probe remains active, showing values 4/1/4; no Stopped job or Bash prompt may appear until the stop control request",
  "G22-reload-*-probe-response.json and *-ownership.json: every query binds run/stage/nonce/PID/birth and checks probe foreground ownership and the waiting parent shell; each query keeps its original three-second deadline",
  "G22-after.png: the last Bash prompt after the reload case",
  "This GTK matrix does not substitute for the same configuration on Windows",
]
