id = "G22"
title = "Bash and Zsh cursor integration versus configured defaults and DECSCUSR"
lang = "en"
config = """
command = direct:/bin/bash --noprofile --norc
language = en
confirm-close-surface = false
env = HISTFILE=/dev/null
"""
script = '''
import shlex
import os
import signal
import select
import termios
import time
private_home = config_home / "shell-home"
private_home.mkdir()
(private_home / ".zshrc").write_text("PROMPT='R6-ZSH%# '\nprintf '%s\\n' \"$GHOSTTY_SHELL_FEATURES|$_ghostty_state\" > \"$HOME/integration.txt\"\n")
# Set inherited environment before launching Ghostty. Config env=ZDOTDIR is
# applied after automatic injection and would deliberately override its path.
os.environ.update(HOME=str(private_home), ZDOTDIR=str(private_home), HISTFILE="/dev/null")
probe = private_home / "cursor_probe.py"
probe.write_text("""import os,sys,termios,tty,select,time,json
from pathlib import Path
old=termios.tcgetattr(0)
try:
 tty.setraw(0)
 os.write(1,b'\\x1b[2 q\\x1bP$q q\\x1b\\\\')
 result=b''
 end=time.monotonic()+3
 while time.monotonic()<end:
  if select.select([0],[],[],0.1)[0]:
   result+=os.read(0,1024)
   if result.endswith(b'\\x1b\\\\'): break
 Path(sys.argv[1]).write_text(json.dumps({'request':'DECSCUSR 2','response_hex':result.hex()}))
 os.write(1,b'\\r\\nR6 TUI STEADY BLOCK; PRESS ENTER\\r\\n')
 os.read(0,1)
finally:
 termios.tcsetattr(0,termios.TCSANOW,old)
""")
def prompt_cursor(label, identity):
    # Freeze only the owned shell's input reader. Query through its PTY slave
    # without executing a command, so preexec cannot mask the prompt's state.
    def state():
        fields = Path(f"/proc/{identity['pid']}/stat").read_text().rsplit(")", 1)[1].split()
        assert int(fields[19]) == identity["birth"], "shell PID was reused"
        return fields[0]
    state()
    handle = os.pidfd_open(identity["pid"])
    terminal = None
    stopped = False
    try:
        state()
        terminal = os.open(identity["fd0"], os.O_RDWR | os.O_NOCTTY | os.O_NONBLOCK)
        assert not termios.tcgetattr(terminal)[3] & termios.ICANON, "shell is not reading a prompt"
        signal.pidfd_send_signal(handle, signal.SIGSTOP)
        stopped = True
        for _ in range(100):
            if state() == "T": break
            sleep(0.01)
        assert state() == "T", "owned shell did not stop"
        os.write(terminal, b"\x1bP$q q\x1b\\")
        response = b""
        deadline = time.monotonic() + 3
        while time.monotonic() < deadline:
            if select.select([terminal], [], [], 0.1)[0]:
                response += os.read(terminal, 1024)
                if response.endswith(b"\x1b\\"): break
        prefix, suffix = b"\x1bP1$r", b" q\x1b\\"
        assert response.startswith(prefix) and response.endswith(suffix), response
        value = int(response[len(prefix):-len(suffix)])
        save("-" + label + "-prompt-query.json", json.dumps({"identity":identity,"response_hex":response.hex(),"value":value},indent=2))
        return value
    finally:
        if stopped:
            try:
                signal.pidfd_send_signal(handle, signal.SIGCONT)
            except ProcessLookupError:
                pass
        if terminal is not None:
            os.close(terminal)
        os.close(handle)
results = []
config_file = config_home / "ghostty/config.ghostty"
for shell in ("bash", "zsh"):
    for feature in ("cursor", "no-cursor"):
        for style in ("block", "bar", "underline"):
            for blink in (False, True):
                label = f"{shell}-{feature}-{style}-{'blink' if blink else 'steady'}"
                command = "direct:/bin/bash --noprofile --norc" if shell == "bash" else "direct:/usr/bin/zsh -d"
                config_file.write_text(f"language = en\ncommand = {command}\nconfirm-close-surface = false\nenv = HISTFILE=/dev/null\ncursor-style = {style}\ncursor-style-blink = {str(blink).lower()}\nshell-integration-features = {feature}\n")
                xdo("mousemove", 400, 300, "click", 1)
                restart()
                if shell == "zsh":
                    integration = (private_home / "integration.txt").read_text()
                    assert "|0" in integration, integration
                    save("-" + label + "-integration.txt", integration)
                xdo("mousemove", 400, 300, "click", 1)
                sleep(0.2)
                capture(label + "-prompt")
                shells = [row for row in processes(label + "-shell") if Path(row["exe"]).name == shell]
                assert len(shells) == 1, shells
                identity = shells[0]
                configured = {"block":1,"underline":3,"bar":5}[style] + (0 if blink else 1)
                initial_cursor = prompt_cursor(label + "-initial", identity)
                assert initial_cursor == configured, (label, configured, initial_cursor)
                if blink:
                    xdo("type", "x")
                    xdo("key", "BackSpace")
                    sleep(0.03)
                    capture(label + "-prompt-active")
                    sleep(0.65)
                    capture(label + "-prompt-idle")
                output = evidence / (label + "-query.json")
                xdo("type", "--clearmodifiers", "--delay", 1, "python3 " + shlex.quote(str(probe)) + " " + shlex.quote(str(output)))
                xdo("key", "Return")
                for _ in range(60):
                    if output.exists(): break
                    sleep(0.1)
                assert output.exists(), label
                result = json.loads(output.read_text())
                assert bytes.fromhex(result["response_hex"]) == b"\x1bP1$r2 q\x1b\\", result
                capture(label + "-tui")
                xdo("key", "Return")
                sleep(0.4)
                returned_cursor = prompt_cursor(label + "-returned", identity)
                assert returned_cursor == (configured if feature == "cursor" else 2), (label, configured, returned_cursor)
                capture(label + "-returned")
                results.append({"case":label,"configured_style":style,"configured_blink":blink,"feature":feature,"shell":shell,
                                "prompt_before":initial_cursor,"prompt_returned":returned_cursor,**result})
save("-cursor-matrix.json", json.dumps(results,indent=2))
# Zsh's vi command indicator remains a block, while insert uses configuration.
config_file.write_text("language = en\ncommand = direct:/usr/bin/zsh -d\nconfirm-close-surface = false\nenv = HISTFILE=/dev/null\ncursor-style = underline\ncursor-style-blink = false\nshell-integration-features = cursor\n")
restart()
xdo("mousemove", 400, 300, "click", 1)
xdo("type", "KEYTIMEOUT=1; bindkey -v")
xdo("key", "Return")
sleep(0.5)
identity = next(row for row in processes("zsh-vi-shell") if Path(row["exe"]).name == "zsh")
assert prompt_cursor("zsh-vi-insert", identity) == 4
capture("zsh-vi-insert")
xdo("key", "Escape")
sleep(0.3)
assert prompt_cursor("zsh-vi-command", identity) == 2
capture("zsh-vi-command")
xdo("key", "i")
sleep(0.3)
assert prompt_cursor("zsh-vi-insert-again", identity) == 4
capture("zsh-vi-insert-again")
'''
expect = [
  "G22.png: an isolated initial Bash terminal",
  "*-prompt.png: the initial prompt shows the configured cursor in all cases; the direct PTY query must match",
  "*-prompt-active.png and *-prompt-idle.png: blinking cases include a key-woken frame and a later frame",
  "*-tui.png: a steady block requested by the test program; query JSON must contain the exact DECRQSS response for DECSCUSR 2",
  "*-returned.png: cursor restores configuration after the TUI; no-cursor deliberately preserves the TUI's steady block",
  "G22-zsh-vi-*.png: insert is configured steady underline; vi command mode remains steady block",
  "G22-after.png: Zsh vi insert mode is restored",
  "This GTK matrix does not substitute for the same configuration on Windows",
]
