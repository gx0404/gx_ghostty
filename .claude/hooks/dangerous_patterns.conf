# gx_ghostty 危险模式唯一真源（PreToolUse 安全门策略）。
# 消费者：.claude/hooks/pre_tool_use_gate.py；Claude Code 与 ZCode 经 block_dangerous.sh 调用，
# Codex 经 .codex/hooks/pre_tool_use_policy.py 调用。改动后必须跑：
#   python -m unittest scripts.test_ai_tool_hooks
# 格式：SECTION<TAB>regex<TAB>理由<TAB>级别，四列缺一不可；空行与 # 开头的行忽略；容忍 CRLF。
# 任一行非法时整份策略失效，安全门对受控工具（Bash、写文件工具、apply_patch）按失败关闭处理（exit 2）。
# SECTION=SHELL 匹配 Bash 命令全文：原文、去掉反斜杠续行（bash）与反引号续行（PowerShell）后的文本各匹配一次，
# 任一命中即算。SECTION=FILE 匹配目标路径：Edit/Write/MultiEdit/NotebookEdit 的路径参数，以及 apply_patch
# 补丁头（*** Add File / Update File / Delete File / Move to）里的路径，Bash 命令调用 apply_patch 时同样提取（尽力而为）。
# 路径先相对化到仓库根，按大小写不敏感匹配。级别：deny 拒绝，ask 交人工确认（Codex 不支持 ask，按 deny 处理）；
# 同一调用同时命中时 deny 优先。
# SHELL 规则一律以同一个命令位置前缀开头：只在行首，或 ; & | ( ) { 反引号 $( 之后命中（) 覆盖 case 分支）；
# 其后可跟 if/elif/while/until/then/do/else/! 等关键字与 VAR=x 前缀，再可跟 sudo/env/xargs/timeout/bash -c/
# sh -c/eval/powershell/pwsh/wsl/iex/Invoke-Expression/Start-Process 等包装词（包装词本身也须在命令位置）。
# 命令名可带引号，前面的目录可用 / 或 \ 分隔；git/gh 子命令与 push 的危险参数也可带引号，参数之间可用逗号
# （PowerShell 的 Start-Process 参数列表）。git/gh 的全局选项用无歧义的 --?\w[\w-]* 逐个跳过：有歧义的写法会
# 指数回溯，hook 超时等于放行。cp/Copy-Item 只按最后一个参数（目标）判定，源文件只是被读取。
# 因此 rg 关键字、heredoc 正文、commit message、echo 里提到危险命令不会命中；heredoc 里位于行首的
# 危险命令仍会命中（bash <<EOF 会真执行，有意保守）。例外是以 > 开头的两条重定向规则，它们没有命令位置可锚。
# 正则看不到引号边界，以下误拦是有意保留的保守行为：引号里的 ; & | ( ) 或反引号后紧跟危险命令；
# 读取类命令（含 rg、grep、python、Get-Content）的参数里出现 .env、id_rsa、.ssh、*.pem 等字面量，
# 例如 rg '\.env' docs/ 也会被拒，换一个不含这些字面量的检索词即可。
