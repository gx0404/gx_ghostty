name: gx-ci

on:
  push:
    branches: [gx_ghostty]
  pull_request:
    branches: [gx_ghostty]
  workflow_dispatch:
    inputs:
      gtk_smoke:
        description: 在 debian:13 容器构建 GTK app，用 xvfb-run 截图并上传证据 artifact
        type: boolean
        default: false
      macos:
        description: 在 macos-15 上运行 zig build test-lib-vt
        type: boolean
        default: false
      cache_probe:
        description: 在同一 runner 复建测试二进制以诊断缓存，不重复执行用例
        type: boolean
        default: false
      win_smoke:
        description: 在 windows-2025 上用钉版 Mesa llvmpipe 启动 win32 app，截图并检查日志，上传证据 artifact
        type: boolean
        default: false

permissions:
  contents: read

# Only pull request runs share a group and cancel superseded runs. Push and manual runs get a
# per-run group: in a shared group a newer run cancels a pending one even without
# cancel-in-progress, and the cancelled push's commit subjects would never be checked.
concurrency:
  group: gx-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rules, CHANGELOG version and framework unit tests
        run: |
          python3 scripts/resolve_agent_rules.py --check
          python3 scripts/version.py --check
          python3 scripts/run_unittests.py
      - name: Knowledge base is up to date (check mode)
        run: python3 scripts/build_agent_kb.py
      - name: Commit subjects on the first-parent chain
        env:
          GX_EVENT: ${{ github.event_name }}
          GX_BEFORE: ${{ github.event.before }}
          GX_AFTER: ${{ github.event.after }}
          GX_BASE: ${{ github.event.pull_request.base.sha }}
          GX_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$GX_EVENT" in
            push)
              # A zero "before" (new branch) makes the script check only the head commit.
              range="${GX_BEFORE:-$zero}..$GX_AFTER"
              ;;
            pull_request)
              range="$GX_BASE..$GX_HEAD"
              ;;
            *)
              range="$zero..$GITHUB_SHA"
              ;;
          esac
          python3 scripts/conventional_commits.py --range "$range"

  zig-fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: zig fmt --check
        run: zig fmt --check .

  linux-vt:
    needs: [framework, zig-fmt]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Keep zig_test.py scheduling timings inside the directory setup-zig caches.
      GX_ZIG_TEST_TIMINGS_DIR: .zig-cache/gx-test-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig saves an empty cache once .zig-cache exceeds cache-size-limit MiB (default 2048).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-size-limit: 4096
          use-tool-cache: true
          cache-key: stable-toolchain-v1
      - name: Cache diagnostics after restore
        timeout-minutes: 3
        run: python3 scripts/ci_cache.py snapshot --suite vt --phase restored --json "$RUNNER_TEMP/gx-zig-test/cache-restored.json"
      - name: Install the ABI manifest verifier dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          python3 -c 'import jsonschema'
      - name: libghostty-vt tests, sharded across processes
        run: python3 scripts/zig_test.py --suite vt --zig-arg=--summary --zig-arg=all --json "$RUNNER_TEMP/gx-zig-test/linux-vt.json"
      - name: Repeat the test binary build without running tests
        if: github.event_name == 'workflow_dispatch' && inputs.cache_probe
        timeout-minutes: 16
        run: python3 scripts/ci_cache.py probe --suite vt --timeout 900 --json "$RUNNER_TEMP/gx-zig-test/cache-probe.json"
      - name: libghostty-vt ABI manifest
        run: zig build test-lib-vt-schema
      - name: Cache diagnostics at job end
        if: always()
        timeout-minutes: 3
        run: python3 scripts/ci_cache.py snapshot --suite vt --phase finished --json "$RUNNER_TEMP/gx-zig-test/cache-finished.json"
      - name: Upload test and cache reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gx-zig-test-linux-vt
          path: ${{ runner.temp }}/gx-zig-test/
          if-no-files-found: ignore
          retention-days: 14

  linux-main:
    needs: [framework, zig-fmt]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Keep zig_test.py scheduling timings inside the directory setup-zig caches.
      GX_ZIG_TEST_TIMINGS_DIR: .zig-cache/gx-test-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig saves an empty cache once .zig-cache exceeds cache-size-limit MiB (default 2048).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-size-limit: 4096
          use-tool-cache: true
          cache-key: stable-toolchain-v1
      - name: Cache diagnostics after restore
        timeout-minutes: 3
        run: python3 scripts/ci_cache.py snapshot --suite main --phase restored --json "$RUNNER_TEMP/gx-zig-test/cache-restored.json"
      - name: Core tests without an app runtime, sharded across processes
        run: python3 scripts/zig_test.py --suite main -Dapp-runtime=none --zig-arg=--summary --zig-arg=all --json "$RUNNER_TEMP/gx-zig-test/linux-main.json"
      - name: Repeat the test binary build without running tests
        if: github.event_name == 'workflow_dispatch' && inputs.cache_probe
        timeout-minutes: 16
        run: python3 scripts/ci_cache.py probe --suite main -Dapp-runtime=none --timeout 900 --json "$RUNNER_TEMP/gx-zig-test/cache-probe.json"
      - name: Cache diagnostics at job end
        if: always()
        timeout-minutes: 3
        run: python3 scripts/ci_cache.py snapshot --suite main --phase finished --json "$RUNNER_TEMP/gx-zig-test/cache-finished.json"
      - name: Upload test and cache reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gx-zig-test-linux-main
          path: ${{ runner.temp }}/gx-zig-test/
          if-no-files-found: ignore
          retention-days: 14

  lib-vt-cross:
    needs: [framework, zig-fmt]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - aarch64-macos
          - wasm32-freestanding
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig keys its cache by job id, which all matrix jobs share.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: ${{ matrix.target }}
      - name: Build libghostty-vt
        env:
          GX_TARGET: ${{ matrix.target }}
        run: zig build -Demit-lib-vt "-Dtarget=$GX_TARGET"

  windows:
    needs: [framework, zig-fmt]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Keep zig_test.py scheduling timings inside the directory setup-zig caches.
      GX_ZIG_TEST_TIMINGS_DIR: .zig-cache/gx-test-timings
    steps:
      - name: Keep repository line endings
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig saves an empty cache once .zig-cache exceeds cache-size-limit MiB (default 2048).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-size-limit: 4096
          use-tool-cache: true
          cache-key: stable-toolchain-v1
      - name: Cache diagnostics after restore
        timeout-minutes: 3
        run: |
          python scripts/ci_cache.py snapshot --suite vt --phase restored --json "$env:RUNNER_TEMP/gx-zig-test/cache-restored.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: libghostty-vt tests, sharded across processes
        run: |
          python scripts/zig_test.py --suite vt --zig-arg=--summary --zig-arg=all --json "$env:RUNNER_TEMP/gx-zig-test/windows.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat the test binary build without running tests
        if: github.event_name == 'workflow_dispatch' && inputs.cache_probe
        timeout-minutes: 16
        run: |
          python scripts/ci_cache.py probe --suite vt --timeout 900 --json "$env:RUNNER_TEMP/gx-zig-test/cache-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build libghostty-vt
        run: |
          zig build -Demit-lib-vt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static linking example
        working-directory: example/c-vt-static
        run: |
          zig build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./zig-out/bin/c_vt_static.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache diagnostics at job end
        if: always()
        timeout-minutes: 3
        run: |
          python scripts/ci_cache.py snapshot --suite vt --phase finished --json "$env:RUNNER_TEMP/gx-zig-test/cache-finished.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test and cache reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gx-zig-test-windows
          path: ${{ runner.temp }}/gx-zig-test/
          if-no-files-found: ignore
          retention-days: 14

  windows-app:
    needs: [framework, zig-fmt]
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep repository line endings
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig saves an empty cache once .zig-cache exceeds cache-size-limit MiB (default 2048).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-size-limit: 4096
          use-tool-cache: true
          cache-key: stable-toolchain-v1
      - name: Build the win32 app
        run: |
          zig build -Dapp-runtime=win32 -Dtarget=x86_64-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test on the pinned Mesa llvmpipe
        if: github.event_name == 'workflow_dispatch' && inputs.win_smoke
        timeout-minutes: 15
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'gx-windows-smoke'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa checksum mismatch' }
          $extracted = Join-Path $env:RUNNER_TEMP 'gx-mesa'
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $extracted x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The app loads Mesa only from the mesa directory next to ghostty.exe.
          $mesa = Join-Path (Resolve-Path 'zig-out/bin') 'mesa'
          New-Item -ItemType Directory -Force -Path $mesa | Out-Null
          $pins = @{
            'opengl32.dll' = '75b295fc80df0eaa8f1264c28663f6932c8b72d36513eb092556608858b7f5e0'
            'libgallium_wgl.dll' = '53e49adf87590d5b0cab8553b1e98084812040cc1fca8c487695b17b7af3702e'
          }
          foreach ($name in $pins.Keys) {
            $file = Join-Path $extracted "x64/$name"
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $pins[$name]) { throw "$name checksum mismatch" }
            Copy-Item -LiteralPath $file -Destination $mesa
          }
          $log = Join-Path $env:LOCALAPPDATA 'ghostty\logs\ghostty.log'
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:GHOSTTY_GX_OPENGL = 'software'
          $app = Start-Process -FilePath (Resolve-Path 'zig-out/bin/ghostty.exe') -PassThru -RedirectStandardOutput (Join-Path $evidence 'stdout.log') -RedirectStandardError (Join-Path $evidence 'stderr.log')
          Start-Sleep -Seconds 20
          $app.Refresh()
          $alive = -not $app.HasExited
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $evidence 'ghostty-windows.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          if ($alive) { Stop-Process -Id $app.Id -Force }
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination (Join-Path $evidence 'ghostty.log') }
          if (-not $alive) { throw "ghostty.exe exited before the screenshot (exit code $($app.ExitCode)); see the evidence logs" }
          if (-not (Select-String -LiteralPath (Join-Path $evidence 'ghostty.log') -SimpleMatch -Quiet 'loaded OpenGL 4.')) { throw 'the app log has no "loaded OpenGL 4." line' }
      - name: Upload smoke evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.win_smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-windows-smoke
          path: ${{ runner.temp }}/gx-windows-smoke/
          if-no-files-found: warn
          retention-days: 14

  gtk-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.gtk_smoke
    needs: [framework, zig-fmt]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:13
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and smoke dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            blueprint-compiler build-essential curl libbz2-dev libonig-dev \
            libxml2-utils lintian lsb-release pandoc \
            libadwaita-1-dev libgtk-4-dev libgtk4-layer-shell-dev \
            git ca-certificates xz-utils gettext \
            xvfb xauth scrot libgl1-mesa-dri
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace for git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Zig matches build.zig.zon
        run: |
          expected="$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)"
          actual="$(zig version)"
          echo "zig $actual, build.zig.zon requires $expected"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "unexpected Zig version" >&2
            exit 1
          fi
      - name: Build the GTK app
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline
      - name: ghostty +version
        run: |
          mkdir -p "$RUNNER_TEMP/gx-gtk-smoke"
          ./zig-out/bin/ghostty +version | tee "$RUNNER_TEMP/gx-gtk-smoke/version.txt"
      - name: Screenshot under Xvfb
        run: |
          evidence="$RUNNER_TEMP/gx-gtk-smoke"
          mkdir -p "$evidence"
          export GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash -euo pipefail -c '
            evidence="$1"
            ./zig-out/bin/ghostty --gtk-single-instance=false >"$evidence/ghostty.log" 2>&1 &
            pid=$!
            sleep 20
            state="$(awk "/^State:/ {print \$2}" "/proc/$pid/status" 2>/dev/null || true)"
            if [ -z "$state" ] || [ "$state" = Z ]; then
              echo "ghostty exited before the screenshot; see ghostty.log" >&2
              exit 1
            fi
            scrot "$evidence/ghostty-xvfb.png"
            kill "$pid"
            wait "$pid" || true
          ' bash "$evidence"
          test -s "$evidence/ghostty-xvfb.png"
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gx-gtk-smoke-evidence
          path: ${{ runner.temp }}/gx-gtk-smoke/
          if-no-files-found: warn
          retention-days: 14

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    needs: [framework, zig-fmt]
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: libghostty-vt tests
        run: zig build test-lib-vt
