# gx_ghostty 领域规则路由（schema v3，唯一机器真源）。
#
# 语义（resolver：scripts/resolve_agent_rules.py，说明见同目录 README.md）：
# - [[rules]].paths 是 Git 可见文件的 glob：`*` 不跨 `/`，`**/` 匹配零或多级
#   目录，`dir/**` 也匹配 `dir` 本身；一个文件命中多个领域时取并集。
# - [[rules]].tasks 把任务类型（--task）路由到额外必读文档。
# - root_only：仓库级元文件，没有领域不变量；与领域 paths 不得重叠。
# - nested_agents：上游自带的嵌套 AGENTS.md 精确登记表；resolver 按 scope 路径的
#   祖先目录输出，不复制其内容。上游新增或删除嵌套文件时 --check 会失败。
# - 根 AGENTS.md 每轮常驻加载，resolver 从不输出它。
#
# 维护：rules 按 id 排序，paths/tasks/root_only/nested_agents 各自排序；
# doc 恒为 docs/AGENT_RULES/<id>.md。任何改动后必须让
# `just rules-check`（python scripts/resolve_agent_rules.py --check）通过。

version = 3
root_max_bytes = 16384

root_only = [
  ".gitmodules",
  ".mailmap",
  "LICENSE",
  "README.md",
]

nested_agents = [
  "example/AGENTS.md",
  "macos/AGENTS.md",
  "src/benchmark/AGENTS.md",
  "src/inspector/AGENTS.md",
  "src/terminal/apc/glyph/AGENTS.md",
  "src/terminal/c/AGENTS.md",
  "src/terminal/compress/AGENTS.md",
  "src/terminal/snapshot/AGENTS.md",
  "test/fuzz-libghostty/AGENTS.md",
]

[[rules]]
id = "app-core"
doc = "docs/AGENT_RULES/app-core.md"
paths = [
  "pkg/breakpad/**",
  "pkg/sentry/**",
  "src/App.zig",
  "src/Surface.zig",
  "src/apprt.zig",
  "src/apprt/*.zig",
  "src/apprt/win32/**",
  "src/crash/**",
  "src/global.zig",
  "src/main.zig",
  "src/main_ghostty.zig",
  "src/main_wasm.zig",
  "src/surface_mouse.zig",
]
tasks = []

